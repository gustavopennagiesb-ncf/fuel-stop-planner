# App theme: a neutral, professional look (slate and navy). Text/background pairs are checked for
# WCAG AA contrast by tests/test_ui_style.py, so a palette change that makes text unreadable fails
# the tests.
[theme]
base = "light"
primaryColor = "#1E3A8A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#020617"
greenColor = "#166534"
orangeColor = "#9A4B00"
redColor = "#B3261E"
metricValueFontSize = "1.8rem"
